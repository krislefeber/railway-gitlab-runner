concurrent = 3
check_interval = 0
connection_max_age = "15m0s"
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "railway-runner"
  url = "${CI_SERVER_URL}"
  token = "${RUNNER_TOKEN}"
  # GitLab Runner has no built-in "kaniko" executor. The shell executor runs
  # job scripts in this container, where /kaniko/executor is installed.
  executor = "shell"
  shell = "bash"
  # Kaniko layer cache settings, available to jobs as environment variables.
  # Use them in a job, e.g.:
  #   /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile \
  #     --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" \
  #     --cache=$KANIKO_CACHE_ENABLED --cache-dir=$KANIKO_CACHE_DIR
  environment = ["KANIKO_CACHE_ENABLED=true", "KANIKO_CACHE_DIR=/kaniko/cache"]
